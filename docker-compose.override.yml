name: hospital

services:
  db:
    container_name: hospital_db
    environment:
      - ACCEPT_EULA=Y 
      - MSSQL_SA_PASSWORD=123@strongPass
    ports:
      - "5434:1433"

  api:
    container_name: hospital-api
    ports:
      - "7000:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=Hospital_Db;User Id=sa;Password=123@strongPass;TrustServerCertificate=True;
    depends_on:
      - db


  client:
    container_name: hospital-client
    environment:
      - HOSPITAL_API_CONFIG=
        {
          "BaseUrl":"http://api:8080/",
          "Endpoints":{
            "PatientBatch":"hospital/patient/batch"
            }
        }
    depends_on:
      - api
    stdin_open: true
    tty: true

